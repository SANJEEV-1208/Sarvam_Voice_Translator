# In: sarvam-live-translator/docker-compose.yml

version: '3.8'

services:
  translator-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: sarvam-translator
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SARVAM_API_KEY=${SARVAM_API_KEY}
    env_file:
      - project/.env
    volumes:
      - ./project:/app:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - translator-network

networks:
  translator-network:
    driver: bridge